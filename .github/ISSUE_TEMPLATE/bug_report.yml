name: Bug Report
description: Report a bug or issue in LuminaRail Smart Contracts
title: "[BUG]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thank you for taking the time to report a bug in `luminarail-contracts`! Please fill out the sections below.
  - type: textarea
    id: summary
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: e.g. Escrow release authority check fails under specific edge condition...
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior in Soroban test environment or CLI.
      placeholder: |
        1. Build contracts via `deploy.sh`
        2. Run `cargo test`
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment & Toolchain Details
      description: Rust toolchain version, Soroban CLI version, OS, etc.
      placeholder: |
        - Rust version: rustc 1.80.0
        - Soroban SDK version: 22.0.1
        - Target: wasm32-unknown-unknown
        - OS: Linux
    validations:
      required: false
